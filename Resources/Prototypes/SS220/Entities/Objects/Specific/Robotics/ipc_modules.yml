- type: entity
  parent: BaseItem
  id: IpcSuitSensorModule
  name: IPC suit sensor module
  description: A module that connects an IPC to the crew monitoring network.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: medical
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: SuitSensor
    randomMode: false
    mode: SensorCords
    controlsLocked: false
    activationContainer: modules
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 1200
  - type: StationLimitedNetwork

- type: entity
  parent: BaseItem
  id: BaseIpcFlashlightModule
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: TriggerOnGotInsertedIntoContainer
    containerId: modules
    keyOut: ipcFlashlightInstall
  - type: TriggerOnGotRemovedFromContainer
    containerId: modules
    keyOut: ipcFlashlightRemove
  - type: RemoveComponentsOnTrigger
    keysIn:
    - ipcFlashlightRemove
    targetUser: true
    components:
    - type: HandheldLight
    - type: PointLight
    - type: IpcFlashlightVisuals

- type: entity
  parent: BaseIpcFlashlightModule
  id: IpcFlashlightModule
  name: IPC flashlight module
  description: A module that equips an IPC with a built-in flashlight.
  components:
  - type: Sprite
    state: power_mod
  - type: AddComponentsOnTrigger
    keysIn:
    - ipcFlashlightInstall
    targetUser: true
    components:
    - type: HandheldLight
      toggleOnInteract: false
      wattage: 0.2
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
      toggleAction: ActionIpcToggleLight
    - type: PointLight
      enabled: false
      energy: 0
      radius: 4
      netsync: true
    - type: IpcFlashlightVisuals
      lightEntity: IpcFlashlightLight
    removeExisting: true

- type: entity
  parent: BaseIpcFlashlightModule
  id: IpcMinerFlashlightModule
  name: IPC mining flashlight module
  description: A bright wide-beam module that equips an IPC with a powerful mining flashlight. Consumes much more energy.
  components:
  - type: Sprite
    state: security
  - type: AddComponentsOnTrigger
    keysIn:
    - ipcFlashlightInstall
    targetUser: true
    components:
    - type: HandheldLight
      toggleOnInteract: false
      wattage: 0.5
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
      toggleAction: ActionIpcToggleLight
    - type: PointLight
      enabled: false
      energy: 0
      radius: 8
      netsync: true
    - type: IpcFlashlightVisuals
      lightEntity: IpcMinerFlashlightLight
    removeExisting: true

- type: entity
  parent: BaseItem
  id: IpcRadioModule
  name: IPC radio module
  description: A module that connects an IPC to the radio network.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: radio
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: Headset
    enabled: false
    isEquipped: false
  - type: EncryptionKeyHolder
    keySlots: 4
    examineHidden: false
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon

- type: entity
  parent: BaseItem
  id: IpcScreenModule
  name: IPC screen module
  description: A module that lets an IPC change its screen.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: service
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: MagicMirror
    organs:
    - Head
    layers:
    - Snout
    changeHairSound: null
    modifyTime: 0
    showPopup: false
    checkHeadSlot: false
    interactable: false
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface

- type: entity
  parent: BaseItem
  id: IpcDrainModule
  name: IPC drain module
  description: A module that lets an IPC drain nearby power sources to recharge itself.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: charger_APC
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: IpcDrainModule
