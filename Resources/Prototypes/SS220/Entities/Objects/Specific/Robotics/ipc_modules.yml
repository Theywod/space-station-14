- type: entity
  parent: BaseItem
  id: IpcSuitSensorModule
  name: IPC suit sensor module
  description: A module that connects an IPC to the crew monitoring network.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: medical
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: SuitSensor
    randomMode: false
    mode: SensorCords
    controlsLocked: false
    activationContainer: modules
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 1200
  - type: StationLimitedNetwork

- type: entity
  parent: BaseItem
  id: IpcFlashlightModule
  name: IPC flashlight module
  description: A module that deploys a flashlight into a dedicated IPC hand. Passively drains the IPC battery.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: power_mod
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: ContainerContainer
    containers:
      holding_container: !type:Container
  - type: IpcItemModule
    items:
    - IpcFlashlight
    activationCost: 50
    passiveDrawFolded: 0.1
    passiveDrawDeployed: 0.2
    foldOnDischarge: true
    actionIcon:
      sprite: SS220/Interface/Actions/ipc/light.rsi
      state: off
    actionIconOn:
      sprite: SS220/Interface/Actions/ipc/light.rsi
      state: on

- type: entity
  parent: BaseItem
  id: IpcMinerFlashlightModule
  name: IPC mining flashlight module
  description: A module that deploys a bright wide-beam mining flashlight into a dedicated IPC hand. Passively drains the IPC battery more.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: security
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: ContainerContainer
    containers:
      holding_container: !type:Container
  - type: IpcItemModule
    items:
    - IpcMinerFlashlight
    activationCost: 50
    passiveDrawFolded: 0.2
    passiveDrawDeployed: 0.5
    foldOnDischarge: true
    actionIcon:
      sprite: SS220/Interface/Actions/ipc/light.rsi
      state: off
    actionIconOn:
      sprite: SS220/Interface/Actions/ipc/light.rsi
      state: on

- type: entity
  parent: BaseItem
  id: IpcRadioModule
  name: IPC radio module
  description: A module that connects an IPC to the radio network.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: radio
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: Headset
    enabled: false
    isEquipped: false
  - type: EncryptionKeyHolder
    keySlots: 4
    examineHidden: false
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon

- type: entity
  parent: BaseItem
  id: IpcScreenModule
  name: IPC screen module
  description: A module that lets an IPC change its screen.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: service
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: MagicMirror
    organs:
    - Head
    layers:
    - Snout
    changeHairSound: null
    modifyTime: 0
    showPopup: false
    checkHeadSlot: false
    interactable: false
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface

- type: entity
  parent: BaseItem
  id: IpcDrainModule
  name: IPC drain module
  description: A module that lets an IPC drain nearby power sources to recharge itself.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: charger_APC
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: IpcDrainModule

- type: entity
  parent: BaseItem
  id: IpcSynthesizerModule
  name: IPC synthesizer module
  description: A module that deploys a synthesizer into a dedicated IPC hand. Passively drains the IPC battery.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: mcontroller
  - type: Item
    size: Small
  - type: Tag
    tags:
    - IpcModule
  - type: ContainerContainer
    containers:
      holding_container: !type:Container
  - type: IpcItemModule
    items:
    - SynthesizerInstrument
    activationCost: 50
    passiveDrawFolded: 0.2
    passiveDrawDeployed: 0.5
    foldOnDischarge: true
    actionIcon:
      sprite: SS220/Objects/Fun/Instruments/h_synthesizer.rsi
      state: icon

